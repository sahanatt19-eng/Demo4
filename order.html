<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Place Your Order</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 20px; background-color: #28a745; color: white; border: none; cursor: pointer; font-size: 16px; }
    button:hover { background-color: #218838; }
  </style>
</head>
<body>

  <h2>Product Order Form</h2>
  <form action="/submit-order" method="POST">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
      <label for="product">Select Product</label>
      <select id="product" name="product">
        <option value="item1">Standard Package - $25</option>
        <option value="item2">Pro Package - $50</option>
        <option value="item3">Enterprise Package - $100</option>
      </select>
    </div>

    <div class="form-group">
      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" name="quantity" min="1" value="1" required>
    </div>

    <div class="form-group">
      <label for="address">Shipping Address</label>
      <textarea id="address" name="address" rows="3" required></textarea>
    </div>

    <button type="submit">Submit Order</button>
  </form>

</body>
</html>
